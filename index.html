<!-- 撮影条件マトリクスダッシュボードV12.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse - 撮影条件マトリクスダッシュボード V12</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2b;
            --accent-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: #2a3447;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 40px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mode-badge {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #60a5fa;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        /* 日付変更コントロールバー */
        .date-control-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .date-control-bar label {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: bold;
        }
        .date-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="date"] {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .today-btn {
            background: #374151;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .today-btn:active { background: #4b5563; }

        /* ファーストビュー：最重要結論 */
        .hero-card {
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.15);
        }
        .hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .hero-title {
            font-size: 14px;
            color: var(--accent-gold);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hero-badge {
            background: rgba(251, 191, 36, 0.2);
            color: var(--accent-gold);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .hero-summary {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            color: #ffffff;
        }

        /* セクション共通タイトル */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            margin: 16px 0 8px 4px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-title span.sub-info {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: normal;
        }

        /* マトリクス表コンテナ */
        .matrix-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px;
            overflow-x: auto;
            margin-bottom: 14px;
        }
        table.matrix-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
        }
        table.matrix-table th, table.matrix-table td {
            border: 1px solid var(--border-color);
            padding: 7px 5px;
        }
        table.matrix-table th {
            background: #1e293b;
            color: var(--text-main);
            font-weight: bold;
        }
        .spot-name {
            text-align: left;
            font-weight: bold;
            background: #1e293b;
            color: #60a5fa;
            position: sticky;
            left: 0;
            z-index: 2;
        }
        .type-label {
            background: #111827;
            color: var(--text-sub);
            font-size: 10px;
            text-align: center;
        }
        
        /* 配色クラス（動的制御用） */
        .c-blue { background-color: #2563eb !important; color: #ffffff !important; font-weight: bold; }   /* 好条件 (低雲量/低月明かり) */
        .c-green { background-color: #16a34a !important; color: #ffffff !important; font-weight: bold; }  /* 注意 (中雲量) */
        .c-yellow { background-color: #eab308 !important; color: #000000 !important; font-weight: bold; } /* 悪条件 (高雲量/高月明かり) */

        /* 月・位置情報カード */
        .grid-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .moon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .moon-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .moon-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 14px;
        }
        .label {
            color: var(--text-sub);
            font-size: 11px;
            margin-bottom: 2px;
        }
        .value {
            font-size: 15px;
            font-weight: bold;
        }

        /* 簡易コンパス */
        .compass-container {
            position: relative;
            width: 100%;
            max-width: 200px;
            height: 200px;
            margin: 0 auto;
            border: 2px dashed var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .compass-dir {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
        }
        .dir-n { top: 6px; }
        .dir-s { bottom: 6px; }
        .dir-e { right: 10px; }
        .dir-w { left: 10px; }
        .moon-marker {
            background: var(--accent-gold);
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.4);
        }

        /* GPV・雲量画像セクション */
        .gpv-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .gpv-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .gpv-btn {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: #60a5fa;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .gpv-btn:hover { background: #2563eb; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>🌌</span> SkyPulse <span style="font-size:11px; color:var(--text-sub);">V12</span>
        </div>
        <div class="header-right">
            <span class="mode-badge">動的マトリクス連動モード</span>
        </div>
    </header>

    <!-- 日付変更コントロールバー -->
    <div class="date-control-bar">
        <label for="target-date">📅 撮影対象日</label>
        <div class="date-input-group">
            <input type="date" id="target-date" onchange="updateDashboard()">
            <button class="today-btn" onclick="resetToToday()">本日</button>
        </div>
    </div>

    <!-- ファーストビュー：最重要結論 -->
    <div class="hero-card">
        <div class="hero-header">
            <div class="hero-title">
                <span>🎯</span> AI行動判断推奨
            </div>
            <div class="hero-badge" id="hero-badge">★★★ 計算中...</div>
        </div>
        <div class="hero-summary" id="hero-summary">
            日付を選択すると、各ポイントの気象条件を算出します。
        </div>
    </div>

    <!-- 複数登録ポイントの時系列マトリクス表 -->
    <div class="section-title">
        <span>📊</span> 登録ポイント別 時間帯マトリクス 
        <span class="sub-info">（雲量 / 月影響）</span>
    </div>
    <div class="matrix-container">
        <table class="matrix-table">
            <thead>
                <tr>
                    <th style="min-width: 65px;">地点</th>
                    <th style="min-width: 35px;">項目</th>
                    <th>18:00</th><th>19:00</th><th>20:00</th><th>21:00</th><th>22:00</th><th>23:00</th><th>0:00</th><th>1:00</th><th>2:00</th>
                </tr>
            </thead>
            <tbody id="matrix-body">
                <!-- JavaScriptにより日付に応じて動的に行が生成・更新されます -->
            </tbody>
        </table>
    </div>

    <!-- 月・位置情報カード -->
    <div class="grid-card">
        <div class="moon-header">
            <div class="moon-title">
                <span>🌙</span> 月の明るさ・位置情報
            </div>
            <div style="background: rgba(251, 191, 36, 0.15); color: var(--accent-gold); padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: bold;" id="moon-phase-badge">計算中</div>
        </div>

        <div class="moon-details">
            <div>
                <div class="label">月齢・明るさ</div>
                <div class="value" id="moon-age-text">-</div>
            </div>
            <div>
                <div class="label">月の出 / 月の入</div>
                <div class="value" style="font-size: 14px;" id="moon-rise-set">-</div>
            </div>
        </div>

        <!-- 方角レーダー -->
        <div class="compass-container">
            <span class="compass-dir dir-n">N(北)</span>
            <span class="compass-dir dir-s">S(南)</span>
            <span class="compass-dir dir-e">E(東)</span>
            <span class="compass-dir dir-w">W(西)</span>
            <div class="moon-marker" id="moon-dir-marker">月 (方向)</div>
        </div>
    </div>

    <!-- GPV・雲量画像確認セクション -->
    <div class="gpv-card">
        <div class="section-title" style="margin: 0 0 8px 0;">
            <span>🗺️</span> 中部の雲量・気象画像リンク
        </div>
        <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 8px;">
            数値予報の裏付けとして、外部の気象ビジュアルを素早く確認できます。
        </div>
        <div class="gpv-links">
            <a href="https://weather-gpv.info/" target="_blank" class="gpv-btn">
                <span>🛰️</span> GPV気象予報
            </a>
            <a href="https://www.jma.go.jp/bosai/clouds/" target="_blank" class="gpv-btn">
                <span>☁️</span> 気象庁 雲の分布
            </a>
        </div>
    </div>

    <script>
        // ポイント定義（地点の追加・変更がしやすい構造）
        const spots = [
            { name: "岐阜", type: "都市近郊" },
            { name: "揖斐", type: "登録1" },
            { name: "根の上", type: "登録2" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            updateDashboard();
        });

        function resetToToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            updateDashboard();
        }

        // 雲量に応じた配色クラスを返す補助関数
        function getCloudClass(val) {
            if (val <= 30) return 'c-blue';   // 好条件
            if (val <= 60) return 'c-green';  // 注意
            return 'c-yellow';                // 悪条件
        }

        // 月影響に応じた配色クラスを返す補助関数
        function getMoonClass(val) {
            if (val <= 20) return 'c-blue';   // 影響小
            if (val <= 60) return 'c-green';  // 影響中
            return 'c-yellow';                // 影響大
        }

        // 日付変更に連動してマトリクス・月情報・推奨をすべて動的生成するメインロジック
        function updateDashboard() {
            const dateStr = document.getElementById('target-date').value;
            if (!dateStr) return;

            const dateObj = new Date(dateStr);
            const m = dateObj.getMonth() + 1;
            const d = dateObj.getDate();
            
            // 日付から一意のハッシュ値を算出し、日ごとにマトリクスの数値を変動させる疑似ロジック
            const seed = (m * 100 + d);
            
            // 各地点のモック変動データ生成
            const matrixData = spots.map((spot, index) => {
                const cloudPattern = [];
                const moonPattern = [];
                
                // 18時〜翌2時（全9スロット）の雲量と月影響を計算
                for (let i = 0; i < 9; i++) {
                    // 日付と時間帯から変動する雲量(% )を算出
                    let cVal = (Math.sin(seed + index + i * 0.7) + 1) * 50; 
                    cVal = Math.round(cVal / 10) * 10; // 10刻み
                    if (cVal < 10) cVal = 10;
                    if (cVal > 100) cVal = 100;
                    cloudPattern.push(cVal);

                    // 月影響(% )算出
                    let mVal = (Math.cos(seed * 0.5 + i * 0.4) + 1) * 45 + 10;
                    mVal = Math.round(mVal / 10) * 10;
                    moonPattern.push(mVal);
                }
                return { ...spot, clouds: cloudPattern, moons: moonPattern };
            });

            // マトリクス表のHTMLを動的構築
            const tbody = document.getElementById('matrix-body');
            tbody.innerHTML = '';

            matrixData.forEach(spot => {
                // 雲行
                const cloudTr = document.createElement('tr');
                cloudTr.innerHTML = `
                    <td rowspan="2" class="spot-name">${spot.name}<br><span style="font-size:9px; color:#9ca3af;">(${spot.type})</span></td>
                    <td class="type-label">雲</td>
                    ${spot.clouds.map(val => `<td class="${getCloudClass(val)}">${val}%</td>`).join('')}
                `;
                tbody.appendChild(cloudTr);

                // 月行
                const moonTr = document.createElement('tr');
                moonTr.innerHTML = `
                    <td class="type-label">月</td>
                    ${spot.moons.map(val => `<td class="${getMoonClass(val)}">${val}%</td>`).join('')}
                `;
                tbody.appendChild(moonTr);
            });

            // 月齢・位置情報データの動的連動
            const moonAges = ["新月期 (輝度 2%)", "上弦の月 (輝度 52%)", "満月期 (輝度 98%)", "下弦の月 (輝度 66%)"];
            const moonDirs = ["北東", "南東", "南西", "西北西"];
            const selectedMoonIndex = seed % moonAges.length;

            document.getElementById('moon-phase-badge').innerText = selectedMoonIndex === 0 ? "新月期" : (selectedMoonIndex === 2 ? "満月期" : "月夜");
            document.getElementById('moon-age-text').innerText = moonAges[selectedMoonIndex];
            document.getElementById('moon-rise-set').innerText = selectedMoonIndex === 0 ? "出 06:00 / 入 18:00" : "出 19:30 / 入 07:45";
            document.getElementById('moon-dir-marker').innerText = `月 (${moonDirs[seed % moonDirs.length]})`;

            // ファーストビューのAI推奨を自動判定して更新
            // 各地点の21時・22時（インデックス3, 4）の平均雲量が最も少ない場所を「ベスト」として選定
            let bestSpotName = matrixData[0].name;
            let minCloud = 999;
            matrixData.forEach(spot => {
                const avgCloud = (spot.clouds[3] + spot.clouds[4]) / 2;
                if (avgCloud < minCloud) {
                    minCloud = avgCloud;
                    bestSpotName = spot.name;
                }
            });

            document.getElementById('hero-badge').innerText = `★★★ ${bestSpotName}がベスト`;
            document.getElementById('hero-summary').innerText = `${m}月${d}日は21時〜22時台の【${bestSpotName}】が雲量${minCloud}%前後と最も抜けが良く、撮影の狙い目です！`;
        }
    </script>
</body>
</html>
