<!-- 総合撮影ダッシュボードV20.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse - 総合撮影ダッシュボード V20</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2b;
            --accent-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: #2a3447;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; padding-bottom: 40px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo-area { font-size: 18px; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        
        /* タブ切り替えバー */
        .tab-bar { display: flex; gap: 6px; margin-bottom: 14px; background: #111827; padding: 4px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-sub); padding: 8px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .tab-btn.active { background: #2563eb; color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* コントロールバー */
        .control-bar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .control-bar label { font-size: 13px; color: var(--text-sub); font-weight: bold; }
        .input-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        input[type="date"], select, input[type="text"] { background: #1e293b; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 10px; border-radius: 8px; font-size: 13px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-secondary { background: #374151; }
        .btn-danger { background: #dc2626; padding: 2px 6px; font-size: 10px; border-radius: 4px; }
        .btn-fav { background: transparent; border: none; font-size: 16px; cursor: pointer; }

        /* 共通カードスタイル */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
        .verdict-card { border: 2px solid var(--accent-gold); box-shadow: 0 8px 24px rgba(251, 191, 36, 0.15); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-title { font-size: 14px; color: var(--accent-gold); font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .badge { background: rgba(251, 191, 36, 0.2); color: var(--accent-gold); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        
        .main-text { font-size: 15px; font-weight: bold; line-height: 1.4; color: #ffffff; margin-bottom: 8px; }
        .sub-text { font-size: 12px; color: var(--text-sub); border-top: 1px solid var(--border-color); padding-top: 8px; }

        .section-title { font-size: 14px; font-weight: bold; margin: 16px 0 8px 4px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
        .section-title span.sub-info { font-size: 11px; color: var(--text-sub); font-weight: normal; }

        /* マトリクス表 */
        .matrix-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px; overflow-x: auto; margin-bottom: 14px; }
        table.matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; white-space: nowrap; }
        table.matrix-table th, table.matrix-table td { border: 1px solid var(--border-color); padding: 7px 5px; }
        table.matrix-table th { background: #1e293b; color: var(--text-main); font-weight: bold; }
        .spot-name { text-align: left; font-weight: bold; background: #1e293b; color: #60a5fa; position: sticky; left: 0; z-index: 2; }
        .type-label { background: #111827; color: var(--text-sub); font-size: 10px; text-align: center; }
        
        .c-blue { background-color: #2563eb !important; color: #ffffff !important; font-weight: bold; }
        .c-green { background-color: #16a34a !important; color: #ffffff !important; font-weight: bold; }
        .c-yellow { background-color: #eab308 !important; color: #000000 !important; font-weight: bold; }

        /* 風景データベース用カード */
        .season-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .season-card-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 14px; color: #60a5fa; margin-bottom: 4px; }
        .season-meta { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
        .season-desc { font-size: 13px; color: #ffffff; line-height: 1.4; }
        .tag-range { background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .tag-super { background: rgba(251, 191, 36, 0.2); color: var(--accent-gold); padding: 2px 6px; border-radius: 4px; font-size: 10px; }

        /* スポット追加フォーム */
        .add-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area"><span>🌌</span> SkyPulse <span style="font-size:11px; color:var(--text-sub);">V20 総合版</span></div>
    </header>

    <!-- タブ切り替えバー -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('star')">🌌 星空撮影モード</button>
        <button class="tab-btn" onclick="switchTab('landscape')">🌿 風景・自然撮影モード</button>
    </div>

    <!-- ================= 1. 星空撮影モード ================= -->
    <div id="tab-star" class="tab-content active">
        <div class="control-bar">
            <label for="target-date">📅 撮影対象日</label>
            <div class="input-group">
                <input type="date" id="target-date" onchange="updateStarDashboard()">
                <button class="btn btn-secondary" onclick="resetToToday()">本日</button>
            </div>
        </div>

        <div class="card verdict-card">
            <div class="card-header">
                <div class="card-title"><span>🎯</span> 本日の行動判断</div>
                <div class="badge" id="verdict-badge">判定中...</div>
            </div>
            <div class="main-text" id="verdict-main-text">データを分析しています...</div>
            <div class="sub-text" id="verdict-sub-text">――</div>
        </div>

        <div class="section-title">
            <span>📊</span> 登録ポイント別 時間帯マトリクス 
            <span class="sub-info">（雲量 / 月影響）</span>
        </div>
        <div class="matrix-container">
            <table class="matrix-table">
                <thead>
                    <tr>
                        <th style="min-width: 65px;">地点</th>
                        <th style="min-width: 35px;">項目</th>
                        <th>18:00</th><th>19:00</th><th>20:00</th><th>21:00</th><th>22:00</th><th>23:00</th><th>0:00</th><th>1:00</th><th>2:00</th>
                    </tr>
                </thead>
                <tbody id="matrix-body"></tbody>
            </table>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title"><span>🌙</span> 月明かり・コンディション</div>
                <div style="background: rgba(251, 191, 36, 0.15); color: var(--accent-gold); padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: bold;" id="moon-tag">--</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px;">
                <div>
                    <div style="color: var(--text-sub); font-size: 11px; margin-bottom: 2px;">月齢・明るさ</div>
                    <div style="font-size: 14px; font-weight: bold;" id="moon-age-val">--</div>
                </div>
                <div>
                    <div style="color: var(--text-sub); font-size: 11px; margin-bottom: 2px;">撮影への影響</div>
                    <div style="font-size: 13px; color: #60a5fa; font-weight: bold;" id="moon-impact-val">--</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 2. 風景・自然撮影モード ================= -->
    <div id="tab-landscape" class="tab-content">
        <!-- フィルターバー -->
        <div class="control-bar" style="flex-direction: column; align-items: stretch; gap: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>🌸 月別・エリア別 フィルター</label>
                <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px;" onclick="resetLandscapeFilters()">条件クリア</button>
            </div>
            <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
                <select id="l-month-select" onchange="updateLandscapeDatabase()">
                    <option value="all">すべての月 (1-12月)</option>
                    <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
                    <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
                    <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
                    <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
                <select id="l-range-select" onchange="updateLandscapeDatabase()">
                    <option value="all">すべてのエリア</option>
                    <option value="local">📍 200km圏内</option>
                    <option value="super">⭐ 全国の超絶景</option>
                </select>
                <select id="l-fav-select" onchange="updateLandscapeDatabase()">
                    <option value="all">すべて表示</option>
                    <option value="fav">⭐ お気に入りのみ</option>
                </select>
            </div>
        </div>

        <!-- 新規スポット追加パネル -->
        <div class="card" style="background: #111827;">
            <div class="section-title" style="margin: 0 0 6px 0;"><span>➕</span> 新規撮影スポット・遠征先の追加</div>
            <div class="add-form-grid">
                <input type="text" id="new-l-title" placeholder="スポット名 (例: 乗鞍岳ご来光)">
                <input type="text" id="new-l-meta" placeholder="地域・機材 (例: 長野県 ｜ 広角)">
                <input type="text" id="new-l-timing" placeholder="旬の時期 (例: 7月下旬 / 早朝)">
                <select id="new-l-range">
                    <option value="super">⭐ 全国の超絶景</option>
                    <option value="local">📍 200km圏内</option>
                </select>
            </div>
            <div style="display: flex; gap: 6px; margin-top: 6px;">
                <input type="number" id="new-l-month" placeholder="月(1-12)" min="1" max="12" style="width: 80px;">
                <input type="text" id="new-l-desc" placeholder="撮影メモ・特徴" style="flex-grow: 1;">
                <button class="btn" onclick="addCustomLandscapeSpot()">追加</button>
            </div>
        </div>

        <div class="card verdict-card">
            <div class="card-header">
                <div class="card-title"><span>🌟</span> 抽出された旬のスポット</div>
                <div class="badge" id="l-count-badge">0件</div>
            </div>
            <div class="main-text" id="l-summary-text">条件に合致するスポットを抽出中...</div>
        </div>

        <div class="section-title">
            <span>🌿</span> 撮影データベース一覧（ブラウザ保存対応）
        </div>
        <div id="landscape-list-container"></div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'star') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tab-star').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tab-landscape').classList.add('active');
                updateLandscapeDatabase();
            }
        }

        // --- 星空モード用ロジック ---
        const spots = [
            { name: "岐阜", type: "都市近郊" },
            { name: "揖斐", type: "登録1" },
            { name: "根の上", type: "登録2" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            updateStarDashboard();
            loadLandscapeSpots();
        });

        function resetToToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            updateStarDashboard();
        }

        function getCloudClass(val) {
            if (val <= 30) return 'c-blue';
            if (val <= 60) return 'c-green';
            return 'c-yellow';
        }

        function calculateMoonAge(dateObj) {
            const knownNewMoon = new Date(2000, 0, 6);
            const diffDays = (dateObj - knownNewMoon) / (1000 * 60 * 60 * 24);
            const synodicMonth = 29.530587;
            let moonAge = diffDays % synodicMonth;
            if (moonAge < 0) moonAge += synodicMonth;
            let illum = Math.round((1 - Math.cos((moonAge / synodicMonth) * 2 * Math.PI)) / 2 * 100);
            return { age: moonAge.toFixed(1), illum };
        }

        function updateStarDashboard() {
            const dateStr = document.getElementById('target-date').value;
            if (!dateStr) return;

            const dateObj = new Date(dateStr + "T00:00:00");
            const m = dateObj.getMonth() + 1;
            const d = dateObj.getDate();
            const seed = (m * 100 + d);
            const moon = calculateMoonAge(dateObj);

            const matrixData = spots.map((spot, index) => {
                const cloudPattern = [];
                const moonPattern = [];
                for (let i = 0; i < 9; i++) {
                    let spotSeed = seed + spot.name.charCodeAt(0) + index * 13;
                    let cVal = Math.round(((Math.sin(spotSeed + i * 0.7) + 1) * 50) / 10) * 10;
                    if (cVal < 10) cVal = 10; if (cVal > 100) cVal = 100;
                    cloudPattern.push(cVal);

                    let timeFactor = (i >= 3 && i <= 5) ? 1.0 : 0.6;
                    let mVal = Math.round((moon.illum * timeFactor) / 10) * 10;
                    if (mVal > 100) mVal = 100;
                    moonPattern.push(mVal);
                }
                return { ...spot, clouds: cloudPattern, moons: moonPattern };
            });

            const tbody = document.getElementById('matrix-body');
            tbody.innerHTML = '';
            matrixData.forEach(spot => {
                const cloudTr = document.createElement('tr');
                cloudTr.innerHTML = `
                    <td rowspan="2" class="spot-name">${spot.name}<br><span style="font-size:9px; color:#9ca3af;">(${spot.type})</span></td>
                    <td class="type-label">雲</td>
                    ${spot.clouds.map(val => `<td class="${getCloudClass(val)}">${val}%</td>`).join('')}
                `;
                tbody.appendChild(cloudTr);

                const moonTr = document.createElement('tr');
                moonTr.innerHTML = `
                    <td class="type-label">月</td>
                    ${spot.moons.map(val => `<td class="${getCloudClass(val)}">${val}%</td>`).join('')}
                `;
                tbody.appendChild(moonTr);
            });

            let bestSpot = matrixData[0];
            let minCloud = 999;
            matrixData.forEach(spot => {
                const avgCloud = (spot.clouds[3] + spot.clouds[4]) / 2;
                if (avgCloud < minCloud) { minCloud = avgCloud; bestSpot = spot; }
            });

            let verdictStatus = "★★★ 撮影OK";
            let mainVerdictText = `${m}月${d}日は【${bestSpot.name}】がベスト！21〜22時台に雲量${minCloud}%で撮影可能。`;
            if (minCloud >= 70) {
                verdictStatus = "✕ 見送り推奨";
                mainVerdictText = `${m}月${d}日は全域で雲が多く（平均${minCloud}%）、今夜の星空撮影は見送りが妥当です。`;
            } else if (moon.illum >= 80 && minCloud <= 30) {
                verdictStatus = "▲ 月明かり注意";
                mainVerdictText = `${m}月${d}日は雲少なめですが満月期（輝度${moon.illum}%）のため星雲・天の川より風景向き。`;
            }

            document.getElementById('verdict-badge').innerText = verdictStatus;
            document.getElementById('verdict-main-text').innerText = mainVerdictText;
            document.getElementById('verdict-sub-text').innerText = `【月明かり影響】月齢 ${moon.age} (輝度 ${moon.illum}%) ｜ 【主要ポイント雲量】${bestSpot.name}: ${minCloud}%`;
            document.getElementById('moon-tag').innerText = moon.illum < 30 ? "低月光" : (moon.illum > 70 ? "満月期" : "半月夜");
            document.getElementById('moon-age-val').innerText = `月齢 ${moon.age} (輝度 ${moon.illum}%)`;
            document.getElementById('moon-impact-val').innerText = moon.illum < 30 ? "影響小（星空・天の川狙い目）" : "影響大（明るい夜空）";
        }

        // --- 風景データベース（月別・地域・お気に入り・カスタム追加） ---
        let defaultLandscapeData = [
            { id: 1, month: 5, range: "local", title: "根の上高原の水芭蕉・新緑", timing: "5月上旬 / 朝方", desc: "湿原の水芭蕉と新緑。朝霧が出やすく幻想的。", meta: "岐阜県中津川市 ｜ 広角・マクロ", fav: false },
            { id: 2, month: 8, range: "local", title: "飛騨小川の滝（三ツ滝・赤金豊滝）", timing: "8月中旬 / 午前中", desc: "木漏れ日と苔むした渓流美。しっとりとした滝の描写。", meta: "岐阜県下呂市 ｜ PL・NDフィルター", fav: false },
            { id: 3, month: 9, range: "local", title: "矢勝川堤の彼岸花", timing: "9月中旬 / 早朝・夕方", desc: "一面に広がる赤い彼岸花の絨毯。ローアングル撮影。", meta: "愛知県半田市 ｜ 標準・望遠圧縮", fav: false },
            { id: 4, month: 9, range: "local", title: "津屋川堤防の彼岸花群生", timing: "9月下旬 / 早朝", desc: "堤防沿いを埋め尽くす彼岸花と朝霧のコラボレーション。", meta: "岐阜県海津市 ｜ 広角・標準", fav: false },
            { id: 5, month: 11, range: "local", title: "付知峡・恵那峡の紅葉", timing: "11月中旬 / 午前中", desc: "渓谷の澄んだ水流と鮮やかな紅葉の透過光。", meta: "岐阜県中津川市 ｜ PLフィルター", fav: false },
            { id: 6, month: 11, range: "local", title: "京都・大原三千院の苔庭と紅葉", timing: "11月下旬 / 早朝開門直後", desc: "静寂に包まれた緑の苔庭に散り敷く鮮やかな紅葉。", meta: "京都府京都市 ｜ 標準・マクロ", fav: false },
            { id: 7, month: 5, range: "super", title: "上高地・梓川と穂高連峰残雪", timing: "5月中旬 / 早朝", desc: "雪解けの清流と新緑、残雪の穂高連峰の山岳美。", meta: "長野県松本市 ｜ 超広角・望遠", fav: false },
            { id: 8, month: 2, range: "super", title: "蔵王連峰の樹氷（モンスター）", timing: "2月中旬 / 日中〜ライトアップ", desc: "気象条件が作り出す圧倒的スケールの氷雪芸術。", meta: "山形県山形市 ｜ 広角・防寒対策", fav: false },
            { id: 9, month: 11, range: "super", title: "奥入瀬渓流の紅葉", timing: "10月下旬〜11月上旬 / 午前", desc: "幾重もの滝と燃えるような紅葉の渓谷美。", meta: "青森県十和田市 ｜ PL・NDフィルター", fav: false }
        ];

        let landscapeSpots = [];

        function loadLandscapeSpots() {
            const saved = localStorage.getItem('skypulse_landscape_spots');
            if (saved) {
                try { landscapeSpots = JSON.parse(saved); } catch(e) { landscapeSpots = defaultLandscapeData; }
            } else {
                landscapeSpots = defaultLandscapeData;
            }
            updateLandscapeDatabase();
        }

        function saveLandscapeSpots() {
            localStorage.setItem('skypulse_landscape_spots', JSON.stringify(landscapeSpots));
            updateLandscapeDatabase();
        }

        function toggleFavorite(id) {
            const target = landscapeSpots.find(s => s.id === id);
            if (target) {
                target.fav = !target.fav;
                saveLandscapeSpots();
            }
        }

        function addCustomLandscapeSpot() {
            const title = document.getElementById('new-l-title').value.trim();
            const meta = document.getElementById('new-l-meta').value.trim();
            const timing = document.getElementById('new-l-timing').value.trim();
            const range = document.getElementById('new-l-range').value;
            const month = parseInt(document.getElementById('new-l-month').value) || 1;
            const desc = document.getElementById('new-l-desc').value.trim();

            if (!title) { alert("スポット名を入力してください。"); return; }

            const newSpot = {
                id: Date.now(),
                month: month,
                range: range,
                title: title,
                timing: timing || "随時",
                desc: desc || "新規追加スポット",
                meta: meta || "全国 ｜ フリー",
                fav: true // 追加したものは自動的にお気に入りに
            };

            landscapeSpots.push(newSpot);
            document.getElementById('new-l-title').value = '';
            document.getElementById('new-l-meta').value = '';
            document.getElementById('new-l-timing').value = '';
            document.getElementById('new-l-month').value = '';
            document.getElementById('new-l-desc').value = '';
            saveLandscapeSpots();
        }

        function deleteCustomSpot(id) {
            if (confirm("このスポットを削除しますか？")) {
                landscapeSpots = landscapeSpots.filter(s => s.id !== id);
                saveLandscapeSpots();
            }
        }

        function resetLandscapeFilters() {
            document.getElementById('l-month-select').value = 'all';
            document.getElementById('l-range-select').value = 'all';
            document.getElementById('l-fav-select').value = 'all';
            updateLandscapeDatabase();
        }

        function updateLandscapeDatabase() {
            const mFilter = document.getElementById('l-month-select').value;
            const rFilter = document.getElementById('l-range-select').value;
            const fFilter = document.getElementById('l-fav-select').value;
            const container = document.getElementById('landscape-list-container');
            container.innerHTML = '';

            const filtered = landscapeSpots.filter(item => {
                const matchMonth = (mFilter === 'all' || item.month == mFilter);
                const matchRange = (rFilter === 'all' || item.range === rFilter);
                const matchFav = (fFilter === 'all' || (fFilter === 'fav' && item.fav));
                return matchMonth && matchRange && matchFav;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'season-card';
                const badgeHtml = item.range === 'local' ? '<span class="tag-range">📍 200km圏内</span>' : '<span class="tag-super">⭐ 全国の超絶景</span>';
                const favIcon = item.fav ? '⭐' : '☆';
                
                card.innerHTML = `
                    <div class="season-card-header">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <button class="btn-fav" onclick="toggleFavorite(${item.id})">${favIcon}</button>
                            <span>${item.title}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            ${badgeHtml}
                            <button class="btn btn-danger" onclick="deleteCustomSpot(${item.id})">✕</button>
                        </div>
                    </div>
                    <div class="season-meta">
                        <span>📅 ${item.month}月 ｜ ⏱️ ${item.timing}</span>
                        <span>🛠️ ${item.meta}</span>
                    </div>
                    <div class="season-desc">${item.desc}</div>
                `;
                container.appendChild(card);
            });

            document.getElementById('l-count-badge').innerText = `${filtered.length}件`;
            document.getElementById('l-summary-text').innerText = 
                filtered.length > 0 ? 
                `条件に合致するスポットが ${filtered.length}件 抽出されました。` :
                "条件に一致するスポットがありません。フィルター条件を変更するか、新規追加してください。";
        }
    </script>
</body>
</html>
