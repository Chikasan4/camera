<!-- 撮影条件マトリクスダッシュボードV17.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse - 星空撮影行動判断ダッシュボード V17</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2b;
            --accent-gold: #fbbf24;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border-color: #2a3447;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; padding-bottom: 40px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo-area { font-size: 18px; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .mode-badge { background: #1e293b; border: 1px solid var(--border-color); color: #60a5fa; padding: 4px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; }

        /* コントロールバー */
        .control-bar { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .control-bar label { font-size: 13px; color: var(--text-sub); font-weight: bold; }
        .input-group { display: flex; align-items: center; gap: 8px; }
        input[type="date"] { background: #1e293b; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 10px; border-radius: 8px; font-size: 14px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-secondary { background: #374151; }

        /* 【最重要】判定ファーストビュー */
        .verdict-card { background: var(--card-bg); border: 2px solid var(--accent-gold); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 8px 24px rgba(251, 191, 36, 0.15); }
        .verdict-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .verdict-title { font-size: 14px; color: var(--accent-gold); font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .verdict-status { background: rgba(251, 191, 36, 0.2); color: var(--accent-gold); padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .verdict-content { font-size: 16px; font-weight: bold; line-height: 1.4; color: #ffffff; margin-bottom: 10px; }
        .verdict-sub { font-size: 12px; color: var(--text-sub); border-top: 1px solid var(--border-color); padding-top: 8px; }

        /* セクション共通 */
        .section-title { font-size: 14px; font-weight: bold; margin: 16px 0 8px 4px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; }
        .section-title span.sub-info { font-size: 11px; color: var(--text-sub); font-weight: normal; }

        /* マトリクス表 */
        .matrix-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px; overflow-x: auto; margin-bottom: 14px; }
        table.matrix-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; white-space: nowrap; }
        table.matrix-table th, table.matrix-table td { border: 1px solid var(--border-color); padding: 7px 5px; }
        table.matrix-table th { background: #1e293b; color: var(--text-main); font-weight: bold; }
        .spot-name { text-align: left; font-weight: bold; background: #1e293b; color: #60a5fa; position: sticky; left: 0; z-index: 2; }
        .type-label { background: #111827; color: var(--text-sub); font-size: 10px; text-align: center; }
        
        .c-blue { background-color: #2563eb !important; color: #ffffff !important; font-weight: bold; }
        .c-green { background-color: #16a34a !important; color: #ffffff !important; font-weight: bold; }
        .c-yellow { background-color: #eab308 !important; color: #000000 !important; font-weight: bold; }

        /* 月明かり情報カード */
        .grid-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
        .moon-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .moon-title { font-size: 14px; font-weight: bold; color: var(--accent-gold); display: flex; align-items: center; gap: 6px; }
        .moon-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .label { color: var(--text-sub); font-size: 11px; margin-bottom: 2px; }
        .value { font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area"><span>🌌</span> SkyPulse <span style="font-size:11px; color:var(--text-sub);">V17</span></div>
        <div class="mode-badge">即決判断モード</div>
    </header>

    <!-- 日付コントロール -->
    <div class="control-bar">
        <label for="target-date">📅 撮影対象日</label>
        <div class="input-group">
            <input type="date" id="target-date" onchange="updateDashboard()">
            <button class="btn btn-secondary" onclick="resetToToday()">本日</button>
        </div>
    </div>

    <!-- 【最重要】最初に端的に表示する判定結果 -->
    <div class="verdict-card" id="verdict-card">
        <div class="verdict-header">
            <div class="verdict-title"><span>🎯</span> 本日の行動判断</div>
            <div class="verdict-status" id="verdict-badge">判定中...</div>
        </div>
        <div class="verdict-content" id="verdict-main-text">
            データを分析しています...
        </div>
        <div class="verdict-sub" id="verdict-sub-text">
            ――
        </div>
    </div>

    <!-- 複数登録ポイントの時間帯マトリクス -->
    <div class="section-title">
        <span>📊</span> 登録ポイント別 時間帯マトリクス 
        <span class="sub-info">（雲量 / 月影響）</span>
    </div>
    <div class="matrix-container">
        <table class="matrix-table">
            <thead>
                <tr>
                    <th style="min-width: 65px;">地点</th>
                    <th style="min-width: 35px;">項目</th>
                    <th>18:00</th><th>19:00</th><th>20:00</th><th>21:00</th><th>22:00</th><th>23:00</th><th>0:00</th><th>1:00</th><th>2:00</th>
                </tr>
            </thead>
            <tbody id="matrix-body"></tbody>
        </table>
    </div>

    <!-- 月明かり影響カード -->
    <div class="grid-card">
        <div class="moon-header">
            <div class="moon-title"><span>🌙</span> 月明かり・コンディション</div>
            <div style="background: rgba(251, 191, 36, 0.15); color: var(--accent-gold); padding: 3px 8px; border-radius: 20px; font-size: 12px; font-weight: bold;" id="moon-tag">--</div>
        </div>
        <div class="moon-details">
            <div>
                <div class="label">月齢・明るさ</div>
                <div class="value" id="moon-age-val">--</div>
            </div>
            <div>
                <div class="label">撮影への影響</div>
                <div class="value" style="font-size: 13px; color: #60a5fa;" id="moon-impact-val">--</div>
            </div>
        </div>
    </div>

    <script>
        // 登録ポイント（岐阜・揖斐・根の上）
        const spots = [
            { name: "岐阜", type: "都市近郊" },
            { name: "揖斐", type: "登録1" },
            { name: "根の上", type: "登録2" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            updateDashboard();
        });

        function resetToToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            updateDashboard();
        }

        function getCloudClass(val) {
            if (val <= 30) return 'c-blue';
            if (val <= 60) return 'c-green';
            return 'c-yellow';
        }

        function getMoonClass(val) {
            if (val <= 20) return 'c-blue';
            if (val <= 60) return 'c-green';
            return 'c-yellow';
        }

        // 天文計算による月齢算出
        function calculateMoonAge(dateObj) {
            const knownNewMoon = new Date(2000, 0, 6);
            const diffDays = (dateObj - knownNewMoon) / (1000 * 60 * 60 * 24);
            const synodicMonth = 29.530587;
            let moonAge = diffDays % synodicMonth;
            if (moonAge < 0) moonAge += synodicMonth;
            let illum = Math.round((1 - Math.cos((moonAge / synodicMonth) * 2 * Math.PI)) / 2 * 100);
            return { age: moonAge.toFixed(1), illum };
        }

        function updateDashboard() {
            const dateStr = document.getElementById('target-date').value;
            if (!dateStr) return;

            const dateObj = new Date(dateStr + "T00:00:00");
            const m = dateObj.getMonth() + 1;
            const d = dateObj.getDate();
            const seed = (m * 100 + d);

            const moon = calculateMoonAge(dateObj);

            // マトリクスデータ生成
            const matrixData = spots.map((spot, index) => {
                const cloudPattern = [];
                const moonPattern = [];
                for (let i = 0; i < 9; i++) {
                    let spotSeed = seed + spot.name.charCodeAt(0) + index * 13;
                    let cVal = Math.round(((Math.sin(spotSeed + i * 0.7) + 1) * 50) / 10) * 10;
                    if (cVal < 10) cVal = 10; if (cVal > 100) cVal = 100;
                    cloudPattern.push(cVal);

                    let timeFactor = (i >= 3 && i <= 5) ? 1.0 : 0.6;
                    let mVal = Math.round((moon.illum * timeFactor) / 10) * 10;
                    if (mVal > 100) mVal = 100;
                    moonPattern.push(mVal);
                }
                return { ...spot, clouds: cloudPattern, moons: moonPattern };
            });

            // 表を描画
            const tbody = document.getElementById('matrix-body');
            tbody.innerHTML = '';
            matrixData.forEach(spot => {
                const cloudTr = document.createElement('tr');
                cloudTr.innerHTML = `
                    <td rowspan="2" class="spot-name">${spot.name}<br><span style="font-size:9px; color:#9ca3af;">(${spot.type})</span></td>
                    <td class="type-label">雲</td>
                    ${spot.clouds.map(val => `<td class="${getCloudClass(val)}">${val}%</td>`).join('')}
                `;
                tbody.appendChild(cloudTr);

                const moonTr = document.createElement('tr');
                moonTr.innerHTML = `
                    <td class="type-label">月</td>
                    ${spot.moons.map(val => `<td class="${getMoonClass(val)}">${val}%</td>`).join('')}
                `;
                tbody.appendChild(moonTr);
            });

            // 最適スポットの判定（21時〜22時台の雲量が最小の場所）
            let bestSpot = matrixData[0];
            let minCloud = 999;
            matrixData.forEach(spot => {
                const avgCloud = (spot.clouds[3] + spot.clouds[4]) / 2;
                if (avgCloud < minCloud) {
                    minCloud = avgCloud;
                    bestSpot = spot;
                }
            });

            // 撮影に向くか向かないかの端的な判定ロジック
            let verdictStatus = "★★★ 撮影OK";
            let mainVerdictText = `${m}月${d}日は【${bestSpot.name}】がベスト！21〜22時台に雲量${minCloud}%で撮影可能。`;
            if (minCloud >= 70) {
                verdictStatus = "✕ 撮影見送り推奨";
                mainVerdictText = `${m}月${d}日は全域で雲が多く（平均${minCloud}%）、今夜の星空撮影は見送りが妥当です。`;
            } else if (moon.illum >= 80 && minCloud <= 30) {
                verdictStatus = "▲ 月明かり注意";
                mainVerdictText = `${m}月${d}日は雲は少なめですが、満月期（輝度${moon.illum}%）のため星雲・天の川より月面・風景撮影向きです。`;
            }

            // UI反映
            document.getElementById('verdict-badge').innerText = verdictStatus;
            document.getElementById('verdict-main-text').innerText = mainVerdictText;
            document.getElementById('verdict-sub-text').innerText = `【月明かり影響】月齢 ${moon.age} (輝度 ${moon.illum}%) ｜ 【主要ポイント雲量】${bestSpot.name}: ${minCloud}%`;

            document.getElementById('moon-tag').innerText = moon.illum < 30 ? "低月光" : (moon.illum > 70 ? "満月期" : "半月夜");
            document.getElementById('moon-age-val').innerText = `月齢 ${moon.age} (輝度 ${moon.illum}%)`;
            document.getElementById('moon-impact-val').innerText = moon.illum < 30 ? "影響小（星空・天の川狙い目）" : "影響大（明るい夜空）";
        }
    </script>
</body>
</html>
