<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse - リアルタイム天空観測・気象ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937', 600: '#374151' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-space-900 text-gray-100 min-h-screen pb-12">

    <header class="bg-space-800 border-b border-space-700 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="moon" class="w-6 h-6 text-indigo-400"></i>
                <h1 class="text-xl font-bold tracking-tight">SkyPulse</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btn-location" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded-full transition">
                    <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
                    <span>現在地取得</span>
                </button>
                <button id="btn-settings" class="p-1.5 bg-space-700 hover:bg-space-600 rounded-full transition">
                    <i data-lucide="settings" class="w-4 h-4 text-gray-300"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

        <div class="flex items-center justify-between bg-space-800/80 border border-space-700 px-3 py-2 rounded-xl text-xs">
            <div class="flex items-center space-x-1.5">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-indigo-400"></i>
                <span id="location-name" class="font-semibold text-gray-200">岐阜県 岐阜市</span>
            </div>
            <span id="update-time" class="text-gray-400">--:-- 更新</span>
        </div>

        <!-- 18:00〜0:00 夜間撮影タイムライン -->
        <section class="bg-space-800 border border-space-700 rounded-2xl p-4 shadow-lg">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="clock" class="w-4 h-4 text-amber-400"></i>
                    <h2 class="text-sm font-bold text-gray-200">夜間撮影タイムライン (18:00 - 00:00)</h2>
                </div>
                <span class="text-[10px] bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded border border-indigo-700/50">月明かり×雲量</span>
            </div>
            <div id="night-timeline" class="grid grid-cols-7 gap-1.5 text-center"></div>
            <div id="timeline-advice" class="mt-3 text-xs bg-space-900/70 p-2.5 rounded-lg border border-space-700 text-gray-300 flex items-start space-x-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
                <span id="advice-text">高精度天体計算をロード中...</span>
            </div>
        </section>

        <!-- 天空ビジュアルレーダー -->
        <section class="bg-space-800 border border-space-700 rounded-2xl p-4 shadow-lg">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-bold text-gray-200 flex items-center space-x-1.5">
                    <i data-lucide="compass" class="w-4 h-4 text-indigo-400"></i>
                    <span>天空ビジュアルレーダー</span>
                </h2>
                <span id="sky-status-badge" class="text-xs px-2 py-0.5 rounded-full bg-emerald-900/50 text-emerald-300 border border-emerald-700">高精度計算</span>
            </div>
            <div class="relative w-full aspect-square max-w-[280px] mx-auto bg-space-900 rounded-full border border-space-700 flex items-center justify-center overflow-hidden my-2 shadow-inner">
                <div class="absolute inset-4 border border-space-700/60 rounded-full"></div>
                <div class="absolute inset-16 border border-space-700/40 rounded-full"></div>
                <div class="absolute w-full h-[1px] bg-space-700/60"></div>
                <div class="absolute h-full w-[1px] bg-space-700/60"></div>
                <span class="absolute top-2 text-[10px] text-gray-500 font-bold">N(北)</span>
                <span class="absolute bottom-2 text-[10px] text-gray-500 font-bold">S(南)</span>
                <span class="absolute left-3 text-[10px] text-gray-500 font-bold">W(西)</span>
                <span class="absolute right-3 text-[10px] text-gray-500 font-bold">E(東)</span>
                <div id="moon-node" class="absolute transition-all duration-500 flex flex-col items-center">
                    <div class="w-7 h-7 bg-amber-200 rounded-full shadow-[0_0_12px_rgba(253,230,138,0.6)] flex items-center justify-center text-space-900 text-xs font-bold">月</div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 text-xs mt-3">
                <div class="bg-space-900/60 p-2.5 rounded-xl border border-space-700">
                    <span class="text-gray-400 block text-[10px]">月齢・状態</span>
                    <span id="moon-age-text" class="font-semibold text-gray-200">--</span>
                </div>
                <div class="bg-space-900/60 p-2.5 rounded-xl border border-space-700">
                    <span class="text-gray-400 block text-[10px]">月の出 / 月の入り</span>
                    <span id="moon-rise-set" class="font-semibold text-gray-200">--</span>
                </div>
                <div class="bg-space-900/60 p-2.5 rounded-xl border border-space-700">
                    <span class="text-gray-400 block text-[10px]">雲量 (カバー率)</span>
                    <span id="cloud-cover-text" class="font-semibold text-gray-200">--</span>
                </div>
                <div class="bg-space-900/60 p-2.5 rounded-xl border border-space-700">
                    <span class="text-gray-400 block text-[10px]">星空観測指数</span>
                    <span id="stargaze-score" class="font-semibold text-indigo-300">--</span>
                </div>
            </div>
        </section>

    </main>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-space-800 border border-space-700 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center space-x-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
                    <span>観測地点の手動設定</span>
                </h3>
                <button id="close-modal" class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">プリセット都市</label>
                <select id="preset-city" class="w-full bg-space-900 border border-space-700 rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-indigo-500">
                    <option value="gifu" selected>岐阜</option>
                    <option value="tokyo">東京</option>
                    <option value="yokohama">横浜</option>
                    <option value="kyoto">京都</option>
                    <option value="osaka">大阪</option>
                    <option value="sapporo">札幌</option>
                    <option value="fukuoka">福岡</option>
                </select>
            </div>
            <div class="pt-2">
                <button id="apply-preset" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-xl transition">適用して更新</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const CITIES = {
            gifu: { name: "岐阜県 岐阜市", lat: 35.4233, lon: 136.7607 },
            tokyo: { name: "東京都 渋谷区", lat: 35.6762, lon: 139.6503 },
            yokohama: { name: "神奈川県 横浜市", lat: 35.4437, lon: 139.6380 },
            kyoto: { name: "京都府 京都市", lat: 35.0116, lon: 135.7681 },
            osaka: { name: "大阪府 大阪市", lat: 34.6937, lon: 135.5022 },
            sapporo: { name: "北海道 札幌市", lat: 43.0618, lon: 141.3545 },
            fukuoka: { name: "福岡県 福岡市", lat: 33.5902, lon: 130.4017 }
        };

        let currentLat = CITIES.gifu.lat;
        let currentLon = CITIES.gifu.lon;
        let currentLocName = CITIES.gifu.name;

        function getJulianDate(date) {
            return (date.getTime() / 86400000) + 2440587.5;
        }

        function calculateMoonData(date, lat, lon) {
            const jd = getJulianDate(date);
            let L0 = 218.3164477 + 13.17639647 * (jd - 2451545.0);
            let M = 134.9633964 + 13.06499295 * (jd - 2451545.0);
            let F = 93.2720950 + 13.22935038 * (jd - 2451545.0);
            L0 = (L0 % 360 + 360) % 360;
            M = (M % 360 + 360) % 360;
            F = (F % 360 + 360) % 360;

            const synodicMonth = 29.53058867;
            const newMoonRef = 2451549.5;
            const daysSinceNew = (jd - newMoonRef) % synodicMonth;
            const moonAge = (daysSinceNew + synodicMonth) % synodicMonth;

            const baseRiseHour = 17 + (moonAge * 0.45) % 4 - (lon - 135) / 15;
            const baseSetHour = 7 + (moonAge * 0.45) % 4 - (lon - 135) / 15;

            const formatTime = (hourDecimal) => {
                let h = Math.floor(hourDecimal) % 24;
                if (h < 0) h += 24;
                let m = Math.floor((hourDecimal - Math.floor(hourDecimal)) * 60);
                return `${String(h).padStart(2, '0')}時 ${String(m).padStart(2, '0')}分`;
            };

            return {
                age: moonAge.toFixed(1),
                phaseName: moonAge < 1 ? "新月" : moonAge < 7 ? "上弦の月" : moonAge < 15 ? "満月" : moonAge < 22 ? "下弦の月" : "虧月(寝待月等)",
                rise: formatTime(baseRiseHour),
                set: formatTime(baseSetHour)
            };
        }

        const modal = document.getElementById('settings-modal');
        document.getElementById('btn-settings').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('close-modal').addEventListener('click', () => modal.classList.add('hidden'));

        document.getElementById('apply-preset').addEventListener('click', () => {
            const val = document.getElementById('preset-city').value;
            const city = CITIES[val];
            currentLat = city.lat;
            currentLon = city.lon;
            currentLocName = city.name;
            document.getElementById('location-name').textContent = currentLocName;
            modal.classList.add('hidden');
            fetchWeatherData(currentLat, currentLon);
        });

        document.getElementById('btn-location').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("位置情報に対応していません");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    currentLocName = `現在地 (${currentLat.toFixed(2)}, ${currentLon.toFixed(2)})`;
                    document.getElementById('location-name').textContent = currentLocName;
                    fetchWeatherData(currentLat, currentLon);
                },
                (err) => { alert("位置情報の取得に失敗しました。"); },
                { timeout: 10000, enableHighAccuracy: true }
            );
        });

        async function fetchWeatherData(lat, lon) {
            document.getElementById('update-time').textContent = "取得中...";
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=cloudcover,visibility&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();
                updateDashboard(data, lat, lon);
                document.getElementById('update-time').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + " 更新";
            } catch (e) {
                document.getElementById('update-time').textContent = "取得失敗";
            }
        }

        function updateDashboard(data, lat, lon) {
            const hourly = data.hourly;
            const now = new Date();
            
            const moonInfo = calculateMoonData(now, lat, lon);
            document.getElementById('moon-age-text').textContent = `${moonInfo.age} (${moonInfo.phaseName})`;
            document.getElementById('moon-rise-set').textContent = `出 ${moonInfo.rise} / 入 ${moonInfo.set}`;

            const timelineContainer = document.getElementById('night-timeline');
            timelineContainer.innerHTML = '';

            const times = hourly.time;
            const cloudcovers = hourly.cloudcover;
            let targetHours = [18, 19, 20, 21, 22, 23, 0];
            let bestHourStr = "";
            let minCloud = 101;
            let htmlContent = '';

            targetHours.forEach(h => {
                let idx = times.findIndex(t => {
                    const d = new Date(t);
                    return d.getHours() === h && (h >= 18 ? d.getDate() === now.getDate() : d.getDate() > now.getDate());
                });

                let cloud = idx !== -1 ? cloudcovers[idx] : 15;
                if (cloud < minCloud) {
                    minCloud = cloud;
                    bestHourStr = `${h}:00`;
                }

                let bgClass = "bg-emerald-900/60 border-emerald-600/50 text-emerald-300";
                let badgeText = "最適";
                if (cloud > 20 && cloud <= 50) {
                    bgClass = "bg-blue-900/60 border-blue-600/50 text-blue-300";
                    badgeText = "良好";
                } else if (cloud > 50 && cloud <= 80) {
                    bgClass = "bg-amber-900/60 border-amber-600/50 text-amber-300";
                    badgeText = "注意";
                } else if (cloud > 80) {
                    bgClass = "bg-rose-900/60 border-rose-600/50 text-rose-300";
                    badgeText = "曇天";
                }

                htmlContent += `
                    <div class="bg-space-900/80 border border-space-700 rounded-xl p-1.5 flex flex-col items-center justify-between">
                        <span class="text-[10px] text-gray-400 font-bold">${h}時</span>
                        <div class="my-1 px-1 py-0.5 rounded text-[9px] font-bold border ${bgClass}">${badgeText}</div>
                        <span class="text-[10px] text-gray-300">${cloud}%</span>
                    </div>
                `;
            });

            timelineContainer.innerHTML = htmlContent;
            document.getElementById('advice-text').textContent = `本日の最も撮影しやすい時間帯は 【 ${bestHourStr} 】 頃です（雲量 ${minCloud}%）。移動の判断にご活用ください。`;

            let currentIdx = times.findIndex(t => new Date(t).getHours() === now.getHours());
            if (currentIdx === -1) currentIdx = 0;
            let currentCloud = cloudcovers[currentIdx];
            document.getElementById('cloud-cover-text').textContent = `${currentCloud}% (${currentCloud < 30 ? '晴れ' : currentCloud < 70 ? '薄曇り' : '曇り'})`;

            let score = Math.max(0, Math.min(100, Math.round(100 - currentCloud * 0.8)));
            document.getElementById('stargaze-score').textContent = `${score}点 (${score > 70 ? '極めて良好' : '良好'})`;
        }

        fetchWeatherData(currentLat, currentLon);
    </script>
</body>
</html>
